# /etc/nginx/sites-available/shortplanner.example.com
# Kör först: certbot --nginx -d shortplanner.example.com

server {
    listen 80;
    listen [::]:80;
    server_name shortplanner.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shortplanner.example.com;

    ssl_certificate     /etc/letsencrypt/live/shortplanner.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortplanner.example.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
